apply plugin: 'com.android.application'

android {
    compileSdkVersion 23
    buildToolsVersion "25.0.3"

    defaultConfig {
        applicationId "com.matburt.mobileorg"
        minSdkVersion 17
        targetSdkVersion 24
        versionCode 1
        versionName "2.0.2"
    }

    signingConfigs {
        release {
            storeFile file('../mobileorg-release.keystore')
            storePassword 'lujun9972'
            keyAlias 'mobileorg'
            keyPassword 'lujun9972'
        }
    }

    lintOptions {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    useLibrary 'org.apache.http.legacy'

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation 'com.actionbarsherlock:actionbarsherlock:4.4.0@aar'
    implementation 'com.jcraft:jsch:0.1.50'
    implementation 'com.android.support:support-v4:25.4.0'
    implementation 'com.android.support:recyclerview-v7:25.4.0'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:2.1.0.201209190230-r'
}
