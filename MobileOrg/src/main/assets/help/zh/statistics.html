<body>
<h1>统计</h1>
<h2>入口与概览</h2>
<p>从主菜单中的「番茄统计」项进入统计页面。Overview 标签显示今日/本周/本月的番茄钟总数与总时长，以及当前时间范围选择器（日/周/月切换）。</p>

<h2>趋势图表</h2>
<p>Trend 标签显示折线图，可视化展示每日番茄钟数量趋势。图表根据顶部选择的时间粒度（日/周/月）动态更新，帮助回顾长期专注模式。</p>

<h2>每日详情</h2>
<p>在 Overview（总览）标签的柱状图中点选某一天，可查看该日的所有番茄钟会话列表（每会话显示开始时间、时长）。用于检查特定日期的工作记录。</p>
</body>
</html>
