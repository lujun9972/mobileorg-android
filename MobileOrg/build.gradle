apply plugin: 'com.android.application'

android {
    namespace 'com.matburt.mobileorg'
    compileSdk 34

    defaultConfig {
        applicationId "com.matburt.mobileorg"
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../mobileorg-release.keystore')
            storePassword 'lujun9972'
            keyAlias 'mobileorg'
            keyPassword 'lujun9972'
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
        abortOnError false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'android.test:runner:1.5.2'
    androidTestImplementation 'android.test:rules:1.5.0'
    androidTestImplementation 'android.test.ext:junit:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.jcraft:jsch:0.1.50'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation project(':libraries:locale')
}
